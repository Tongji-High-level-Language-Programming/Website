# 构建 VitePress 站点并将其部署到 GitHub Pages 的示例工作流程
#
name: Deploy VitePress site to Pages

on:
  # 在针对 `main` 分支的推送与 Pull Request 上运行。其中，PR 时只尝试构建，而不上传。
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # 允许你从 Actions 选项卡手动运行此工作流程
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 集中管理相关依赖版本和常量
env:
  ARTIFACT_NAME: vitepress-build
  BUILD_DIR: docs/.vitepress/dist
  TJ_REMOTE_PATH: /home/httpd/hlp-website/Website/

  NODE_VERSION: 24

  # https://github.com/actions/checkout
  checkout: &action_checkout actions/checkout@v7
  # https://github.com/actions/setup-node
  setup_node: &action_setup_node actions/setup-node@v7
  # https://github.com/pnpm/action-setup
  setup_pnpm: &action_setup_pnpm pnpm/action-setup@v6
  # https://github.com/actions/configure-pages
  configure_pages: &action_configure_pages actions/configure-pages@v6
  # https://github.com/actions/upload-pages-artifact
  upload_pages_artifact: &action_upload_pages_artifact actions/upload-pages-artifact@v5
  # https://github.com/actions/deploy-pages
  deploy_pages: &action_deploy_pages actions/deploy-pages@v5
  # https://github.com/actions/upload-artifact
  upload_artifact: &action_upload_artifact actions/upload-artifact@v7
  # https://github.com/actions/download-artifact
  download_artifact: &action_download_artifact actions/download-artifact@v8
  # https://github.com/burnett01/rsync-deployments
  rsync_deploy: &action_rsync_deploy burnett01/rsync-deployments@v9

jobs:
  # 构建工作
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with lfs dependencies)
        uses: *action_checkout
        with:
          lfs: true
          fetch-depth: 0 # 如果未启用 lastUpdated，则不需要
      - name: Checkout LFS objects
        run: git lfs checkout
      - name: Setup Node
        uses: *action_setup_node
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: *action_setup_pnpm
        with:
          cache: true
      - name: Setup Pages
        uses: *action_configure_pages
      - name: Install dependencies
        run: pnpm install
      - name: Build with VitePress
        run: pnpm docs:build
      - name: Upload artifact
        uses: *action_upload_pages_artifact
        with:
          path: ${{ env.BUILD_DIR }}
      # 上传构建产物作为通用artifact，供部署到自有服务器使用
      - name: Upload build artifact for server deployment
        uses: *action_upload_artifact
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.BUILD_DIR }}

  # 部署到 Github Pages
  deploy-gh-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # 仅在推送到 main 时部署

    # 只允许同时进行一次部署，跳过正在运行和最新队列之间的运行队列
    # 但是，不要取消正在进行的运行，因为我们希望允许这些生产部署完成
    concurrency:
      group: pages-gh
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to Github Pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: *action_deploy_pages

  # 部署到校内服务器
  deploy-tongji-server:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # 仅在推送到 main 时部署

    # 只允许同时进行一次部署，跳过正在运行和最新队列之间的运行队列
    # 但是，不要取消正在进行的运行，因为我们希望允许这些生产部署完成
    concurrency:
      group: pages-tongji
      cancel-in-progress: false
    environment:
      name: tongji-server
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to Tongji Server
    steps:
      - name: Download build artifact
        uses: *action_download_artifact
        with:
          name: ${{ env.ARTIFACT_NAME }}
      - name: Deploy to Server via SSH
        uses: *action_rsync_deploy
        with:
          remote_path: ${{ env.TJ_REMOTE_PATH }}
          remote_host: ${{ secrets.SERVER_HOST}}
          remote_user: ${{ secrets.USERNAME }}
          remote_key: ${{ secrets.KEY }}
          remote_port: ${{ secrets.SERVER_PORT}}
          remote_key_pass: ${{ secrets.PASSPHRASE }}
          switches: -avrz --delete
